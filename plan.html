<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novax Engine · Plan y ejecución</title>
  <link rel="stylesheet" href="estilo.css?v=2.0">
</head>
<body>
  <header class="barra">
    <b>NOVAX <span>ENGINE</span></b>
    <nav aria-label="Secciones">
      <a href="index.html">Tablero</a>
      <a href="plan.html" aria-current="page">Plan y ejecución</a>
    </nav>
  </header>

  <main>
    <div class="titulo">
      <div>
        <h1>Plan y ejecución</h1>
        <p class="sub">Lo planificado y lo ejecutado en la misma fila. Al enviar el plan se bloquea, pero se sigue viendo.</p>
      </div>
      <label>Proyecto
        <select id="proyecto"></select>
      </label>
    </div>
    <p id="aviso" class="aviso" role="alert" hidden></p>

    <h2>Planes de 2 semanas</h2>
    <div class="periodos" id="periodos" role="group" aria-label="Planes del proyecto"></div>

    <ol class="pasos" id="pasos" aria-label="Etapas del plan"></ol>
    <section class="estado" id="estado" aria-live="polite"></section>

    <form id="form" novalidate>
      <div class="tabla">
        <table>
          <thead id="cabecera"></thead>
          <tbody id="filas"></tbody>
          <tfoot id="totales"></tfoot>
        </table>
      </div>
      <button type="submit" id="boton"></button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="config.js?v=2.0"></script>
  <script src="app.js?v=2.0"></script>
  <script>
    const $ = id => document.getElementById(id);
    const NUEVO = 'nuevo';
    let causas = [];
    let planes = [];
    let rubros = [];
    let tareas = [];
    let elegido = NUEVO;

    const modo = plan => (plan === NUEVO ? 'nuevo' : plan.cerrado ? 'cerrado' : 'enviado');

    const proximoLunes = () => {
      const hoy = new Date();
      hoy.setDate(hoy.getDate() + (((8 - hoy.getDay()) % 7) || 7));
      return hoy.toLocaleDateString('en-CA');
    };

    const fin = inicio => {
      const dato = dia(inicio);
      dato.setDate(dato.getDate() + 11);
      return dato.toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long' });
    };

    const marca = (ok, texto) =>
      `<span class="etiqueta ${ok ? 'ok' : 'mal'}"><i data-lucide="${ok ? 'check' : 'x'}"></i> ${h(texto)}</span>`;

    const casilla = (nombre, texto, rubro) =>
      `<label><input type="checkbox" name="${nombre}" aria-label="${h(texto)}: ${h(rubro)}"> ${h(texto)}</label>`;

    const campo = (tarea, nombre) => $('filas').querySelector(`tr[data-id="${tarea.id}"] [name="${nombre}"]`);

    const ejecutado = tarea => {
      const entrada = campo(tarea, 'real');
      if (!entrada) return tarea.cantidad_real === null ? null : Number(tarea.cantidad_real);
      return entrada.value === '' ? null : Number(entrada.value);
    };

    const cumplimiento = tarea => {
      const real = ejecutado(tarea);
      const valor = real === null ? null : pct(real, tarea.cantidad_plan);
      return barraMini(valor, semaforo(valor, 100, 50));
    };

    function pintarPeriodos() {
      const botones = [`<button type="button" data-plan="${NUEVO}" aria-pressed="${elegido === NUEVO}">
          <span><i data-lucide="plus"></i> Nuevo plan</span><span class="etiqueta">Por enviar</span></button>`];
      for (const plan of planes) {
        const valor = pct(plan.cumplidas, plan.tareas);
        const estado = plan.cerrado
          ? `<span class="etiqueta ${semaforo(valor, META.ppc, 70)}"><i data-lucide="check"></i> Cerrado · cumplió ${valor} %</span>`
          : '<span class="etiqueta alerta"><i data-lucide="lock"></i> Bloqueado · falta cerrar</span>';
        botones.push(`<button type="button" data-plan="${plan.id}" aria-pressed="${elegido?.id === plan.id}">
          <span>${periodo(plan.inicio)}</span>${estado}</button>`);
      }
      $('periodos').innerHTML = botones.join('');
    }

    function pintarPasos() {
      const pasos = [['Planificar', 'pencil'], ['Enviado y bloqueado', 'lock'], ['Ejecutado y cerrado', 'flag']];
      const actual = { nuevo: 0, enviado: 1, cerrado: 2 }[modo(elegido)];
      $('pasos').innerHTML = pasos.map(([texto, icono], i) => {
        const clase = i < actual || modo(elegido) === 'cerrado' ? 'hecho' : i === actual ? 'actual' : '';
        return `<li class="${clase}"><i data-lucide="${clase === 'hecho' ? 'check' : icono}"></i> ${i + 1}. ${texto}</li>`;
      }).join('');
    }

    function calidad(plan) {
      const [texto, clase] = nivel(plan.nota);
      return `<div class="caja">
        <h2>Calidad del plan</h2>
        <div class="grande">${plan.nota}<small> / 100</small> <span class="etiqueta ${clase}">${texto}</span></div>
        <p class="sub">${META.nota} o más es buen plan; de ${META.revisar} a ${META.nota - 1}, revisar; menos de ${META.revisar}, rehacer.</p>
        ${CRITERIOS.map(([campo, nombre, pregunta]) => `<div class="criterio"><span>${nombre}<small>${pregunta}</small></span>
          ${barraMini(plan[campo], semaforo(plan[campo], META.nota, META.revisar))}</div>`).join('')}
        <p class="sub">Restricciones liberadas antes de empezar:
          <b>${plan.restricciones ? `${plan.liberadas} de ${plan.restricciones}` : 'no había ninguna'}</b></p>
      </div>`;
    }

    function pintarEstado() {
      const plan = elegido;
      if (plan === NUEVO) {
        $('estado').innerHTML = `<div class="caja">
            <h2><i data-lucide="pencil"></i> Paso 1 · Planificar las 2 semanas</h2>
            <p class="sub">Pon la cantidad solo en los rubros que vas a hacer y marca si están listos para hacerse.
              Se entrega el jueves o viernes antes del lunes. Al enviarlo queda bloqueado.</p>
            <label>Lunes de inicio <small>el plan cubre ese lunes y la semana siguiente</small>
              <input type="date" id="inicio" value="${proximoLunes()}" required></label>
          </div>
          <div class="caja">
            <h2>Cómo se califica el plan</h2>
            <p class="sub">Promedio de 6 criterios. Tres los revisa el sistema y tres salen de tus casillas.</p>
            ${CRITERIOS.map(([, nombre, pregunta]) => `<div class="criterio"><span>${nombre}</span><small>${pregunta}</small></div>`).join('')}
          </div>`;
        return;
      }
      const valor = pct(plan.cumplidas, plan.tareas);
      const dineroPct = pct(plan.valor_real, plan.valor_plan);
      const [texto, clase] = plan.cerrado ? lectura(plan) : ['', ''];
      const resumen = plan.cerrado
        ? `<h2><i data-lucide="flag"></i> Plan cerrado</h2>
           <div class="grande">${valor} %<small> cumplido</small></div>
           <p>Se cumplieron <b>${plan.cumplidas} de ${plan.tareas} rubros</b>. En dinero se ejecutó
             <b>${dinero(plan.valor_real)} de ${dinero(plan.valor_plan)}</b> (${dineroPct} %).</p>
           ${plan.externas ? `<p>${plan.dias_externos} días de atraso por causas externas, documentados para la SDC.</p>` : ''}
           <span class="etiqueta ${clase}">${h(texto)}</span>`
        : `<h2><i data-lucide="lock"></i> Plan enviado y bloqueado</h2>
           <div class="grande">${plan.tareas}<small> rubros planificados</small></div>
           <p>Enviado el <b>${fecha(plan.entregado)}</b>. Cubre del ${periodo(plan.inicio)}.</p>
           <p>Paso 2: el <b>${fin(plan.inicio)}</b> anota aquí lo ejecutado de cada rubro y cierra el plan.</p>`;
      $('estado').innerHTML = `<div class="caja">${resumen}</div>${calidad(plan)}`;
    }

    function pintarTabla() {
      const actual = modo(elegido);
      const ejecucion = actual === 'nuevo'
        ? '<th class="ejecucion">Ejecutado</th>'
        : '<th class="ejecucion">Ejecutado</th><th class="ejecucion">Cumplimiento</th><th class="ejecucion">Causa si no se cumplió</th><th class="ejecucion">Días</th>';
      $('cabecera').innerHTML = `<tr><th>Rubro</th><th>Planificado</th><th>¿Listo para hacerse?</th><th>Restricción</th>${ejecucion}</tr>`;

      if (actual === 'nuevo') {
        $('filas').innerHTML = rubros.map(r => {
          const nombre = `${r.item} · ${r.descripcion}`;
          return `<tr data-id="${r.id}">
            <td><b>${h(nombre)}</b><small>Contrato ${numero(r.cantidad_contrato)} ${h(r.unidad)} · rinde ${numero(r.rendimiento_dia)} ${h(r.unidad)}/día · cronograma ${fecha(r.inicio)} al ${fecha(r.fin)}</small></td>
            <td class="cant"><input type="number" name="cantidad" min="0" step="any" inputmode="decimal" aria-label="Cantidad planificada de ${h(nombre)}"> ${h(r.unidad)}</td>
            <td><div class="listo">${casilla('secuencia', 'Lo previo ya está', nombre)}${casilla('recursos', 'Cuadrilla y equipo', nombre)}${casilla('anticipacion', 'Material pedido', nombre)}</div></td>
            <td><input type="text" name="restriccion" placeholder="Ej.: permiso de LUG" aria-label="Restricción pendiente de ${h(nombre)}">
              <div class="listo">${casilla('liberada', 'Ya liberada', nombre)}</div></td>
            <td class="ejecucion bloqueado"><small>Se llena al cierre</small></td>
          </tr>`;
        }).join('') || '<tr><td colspan="5"><small>Este proyecto no tiene rubros cargados.</small></td></tr>';
        $('totales').innerHTML = '';
        return;
      }

      const opciones = ['evitable', 'externa'].map(tipo =>
        `<optgroup label="${tipo === 'evitable' ? 'Evitables (nuestras)' : 'Externas (se reclaman)'}">${causas
          .filter(c => c.tipo === tipo)
          .map(c => `<option value="${h(c.codigo)}">${h(c.nombre)}: ${h(c.detalle)}</option>`).join('')}</optgroup>`).join('');

      $('filas').innerHTML = tareas.map(t => {
        const nombre = `${t.item} · ${t.descripcion}`;
        const restriccion = t.restriccion
          ? `${h(t.restriccion)}<br>${t.restriccion_liberada ? '<span class="etiqueta ok">Liberada</span>' : '<span class="etiqueta alerta">Pendiente</span>'}`
          : '<small>Ninguna</small>';
        const real = actual === 'enviado'
          ? `<input type="number" name="real" min="0" step="any" inputmode="decimal" required aria-label="Ejecutado de ${h(nombre)}"> ${h(t.unidad)}`
          : `${numero(t.cantidad_real)} ${h(t.unidad)}`;
        const causa = actual === 'enviado'
          ? `<select name="causa" aria-label="Causa de ${h(nombre)}"><option value="">—</option>${opciones}</select>`
          : t.causa ? `<span class="etiqueta ${t.causa_tipo}">${h(t.causa_nombre)}</span>` : t.cumplida ? marca(true, 'Cumplido') : '—';
        const dias = actual === 'enviado'
          ? `<input type="number" name="dias" min="0" step="1" value="0" aria-label="Días de atraso de ${h(nombre)}">`
          : t.dias_atraso || '—';
        return `<tr data-id="${t.id}">
          <td><b>${h(nombre)}</b></td>
          <td class="cant bloqueado"><i data-lucide="lock"></i> ${numero(t.cantidad_plan)} ${h(t.unidad)}</td>
          <td><div class="listo">${marca(t.secuencia_ok, 'Lo previo')}${marca(t.recursos_ok, 'Cuadrilla y equipo')}${marca(t.anticipacion_ok, 'Material')}</div></td>
          <td>${restriccion}</td>
          <td class="ejecucion cant">${real}</td>
          <td class="ejecucion" data-cumplimiento>${cumplimiento(t)}</td>
          <td class="ejecucion">${causa}</td>
          <td class="ejecucion">${dias}</td>
        </tr>`;
      }).join('');
      pintarTotales();
    }

    function pintarTotales() {
      const conDato = tareas.filter(t => ejecutado(t) !== null);
      const plan = tareas.reduce((total, t) => total + t.cantidad_plan * t.precio_unitario, 0);
      const real = conDato.reduce((total, t) => total + Math.min(ejecutado(t), t.cantidad_plan) * t.precio_unitario, 0);
      const cumplidas = conDato.filter(t => ejecutado(t) >= t.cantidad_plan).length;
      const valor = conDato.length ? pct(real, plan) : null;
      $('totales').innerHTML = `<tr>
        <td colspan="4">Total de las 2 semanas · ${cumplidas} de ${tareas.length} rubros cumplidos</td>
        <td class="ejecucion num">${dinero(real)} de ${dinero(plan)}</td>
        <td class="ejecucion">${barraMini(valor, semaforo(valor, META.cantidades, 70))}</td>
        <td class="ejecucion" colspan="2"></td>
      </tr>`;
    }

    function pintar() {
      pintarPeriodos();
      pintarPasos();
      pintarEstado();
      pintarTabla();
      $('boton').hidden = modo(elegido) === 'cerrado';
      $('boton').textContent = modo(elegido) === 'nuevo' ? 'Enviar plan (queda bloqueado)' : 'Cerrar plan';
      window.lucide?.createIcons();
    }

    async function elegir(id) {
      elegido = planes.find(p => p.id === Number(id)) ?? NUEVO;
      tareas = elegido === NUEVO ? [] : await leer(db.from('v_tarea').select('*').eq('plan_id', elegido.id).order('item'));
      const url = new URL(location.href);
      url.searchParams.set('proyecto', $('proyecto').value);
      url.searchParams.set('plan', elegido === NUEVO ? NUEVO : elegido.id);
      history.replaceState(null, '', url);
      pintar();
    }

    async function cargarProyecto(id) {
      const codigo = $('proyecto').value;
      [planes, rubros] = await Promise.all([
        leer(db.from('v_plan').select('*').eq('proyecto', codigo).order('inicio', { ascending: false })),
        leer(db.from('rubro').select('*').eq('proyecto', codigo).order('item')),
      ]);
      await elegir(id ?? planes.find(p => !p.cerrado)?.id ?? NUEVO);
    }

    async function enviar() {
      const inicio = $('inicio').value;
      const nuevas = [...$('filas').querySelectorAll('tr[data-id]')]
        .map(fila => ({ fila, dato: nombre => fila.querySelector(`[name="${nombre}"]`) }))
        .filter(({ dato }) => Number(dato('cantidad').value) > 0)
        .map(({ fila, dato }) => ({
          rubro: Number(fila.dataset.id),
          cantidad: Number(dato('cantidad').value),
          secuencia: dato('secuencia').checked,
          recursos: dato('recursos').checked,
          anticipacion: dato('anticipacion').checked,
          restriccion: dato('restriccion').value,
          liberada: dato('liberada').checked,
        }));
      if (!inicio) return avisar('Elige el lunes de inicio.');
      if (dia(inicio).getDay() !== 1) return avisar('El plan tiene que empezar un lunes.');
      if (!nuevas.length) return avisar('Pon la cantidad de al menos un rubro.');
      const id = await leer(db.rpc('crear_plan', { p_proyecto: $('proyecto').value, p_inicio: inicio, p_tareas: nuevas }));
      await cargarProyecto(id);
      avisar('Plan enviado. Quedó bloqueado y lo sigues viendo aquí hasta el cierre.', 'ok');
    }

    async function cerrar() {
      const faltaReal = tareas.find(t => ejecutado(t) === null || ejecutado(t) < 0);
      if (faltaReal) {
        campo(faltaReal, 'real').focus();
        return avisar('Falta lo ejecutado de algún rubro (pon 0 si no se hizo nada).');
      }
      const faltaCausa = tareas.find(t => ejecutado(t) < t.cantidad_plan && !campo(t, 'causa').value);
      if (faltaCausa) {
        campo(faltaCausa, 'causa').focus();
        return avisar('Elige la causa de los rubros que no llegaron a lo planificado.');
      }
      const id = elegido.id;
      await leer(db.rpc('cerrar_plan', {
        p_plan: id,
        p_tareas: tareas.map(t => ({ id: t.id, real: ejecutado(t), causa: campo(t, 'causa').value, dias: Number(campo(t, 'dias').value) || 0 })),
      }));
      await cargarProyecto(id);
      avisar('Plan cerrado. Ya cuenta en el tablero.', 'ok');
    }

    $('form').addEventListener('submit', async evento => {
      evento.preventDefault();
      avisar('');
      $('boton').disabled = true;
      try {
        await (modo(elegido) === 'nuevo' ? enviar() : cerrar());
      } catch (error) {
        fallo(error);
      } finally {
        $('boton').disabled = false;
      }
    });

    $('filas').addEventListener('input', evento => {
      if (evento.target.name !== 'real') return;
      const fila = evento.target.closest('tr');
      const tarea = tareas.find(t => t.id === Number(fila.dataset.id));
      fila.querySelector('[data-cumplimiento]').innerHTML = cumplimiento(tarea);
      pintarTotales();
    });

    $('periodos').addEventListener('click', evento => {
      const boton = evento.target.closest('button[data-plan]');
      if (boton) elegir(boton.dataset.plan).catch(fallo);
    });

    $('proyecto').addEventListener('change', () => cargarProyecto().catch(fallo));

    (async () => {
      const parametros = new URLSearchParams(location.search);
      const [proyectos, listaCausas] = await Promise.all([
        leer(db.from('proyecto').select('*').neq('estado', 'En cierre').order('codigo')),
        leer(db.from('causa').select('*').order('tipo').order('nombre')),
      ]);
      causas = listaCausas;
      $('proyecto').innerHTML = proyectos.map(p => `<option value="${h(p.codigo)}">${h(p.codigo)} · ${h(p.nombre)}</option>`).join('');
      if (proyectos.some(p => p.codigo === parametros.get('proyecto'))) $('proyecto').value = parametros.get('proyecto');
      await cargarProyecto(parametros.get('plan') ?? undefined);
    })().catch(fallo);
  </script>
</body>
</html>
